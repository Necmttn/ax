name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build artifacts for. Leave empty to run release-please.
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual releases to run from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || {
            echo "::error::manual release retries must run from main" >&2
            exit 1
          }

  release-please:
    needs: validate-dispatch
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag_name == '') }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Primes the DuckDB build cache from a TRUSTED default-branch (`main`) run
  # so the next release tag gets a warm restore instead of a from-scratch
  # build. GitHub Actions scopes a saved cache to the ref that created it
  # plus the repository's default branch - it does NOT share a cache
  # between two different tags - so build-artifacts' tag-scoped save (below)
  # only ever helps a RETRY of that same tag, never the next release.
  # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
  #
  # Gated on `releases_created` (release-please's own output, set only on the
  # push where it actually cuts a release) so this doesn't run three
  # expensive full-matrix runners on every ordinary main push - just the rare
  # push that creates a release. The artifact matrix starts from the same push
  # after release resolution, so this prime run may race it and lose the save
  # on a shared first-ever cache miss. It seeds releases after this one.
  # No release publishing happens here (build/smoke/save only), so the
  # Publication stays in the single publish-artifacts job below.
  prime-duckdb-cache:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    name: Prime DuckDB cache (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    # Mirrors build-artifacts' cold-build headroom - a prime run misses the
    # cache exactly like a build-artifacts run would on the same inputs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Must match build-artifacts' matrix runners exactly - the cache key
        # is a function of (runner.os, runner.arch), so priming a runner
        # build-artifacts doesn't use would seed a key nothing ever reads.
        include:
          - runner: macos-14
            artifact: axctl-darwin-arm64
          - runner: macos-15-intel
            artifact: axctl-darwin-x64
          - runner: ubuntu-24.04
            artifact: axctl-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # The dynamic library smoke imports @ax/lib through the workspace link.
      # Install before both a cache-hit smoke and a cache-miss build.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # No CLI build, no packaging, no upload-artifact, no release publish -
      # this job's only job is to leave a warm, smoke-verified cache entry
      # behind under the default-branch scope.
      - name: Provision DuckDB build
        uses: ./.github/actions/provision-duckdb
        with:
          label: ${{ matrix.artifact }} (default-branch prime)

  resolve-release:
    needs: [validate-dispatch, release-please]
    if: >-
      ${{ always()
      && needs.validate-dispatch.result == 'success'
      && ((needs.release-please.result == 'success'
          && needs.release-please.outputs.releases_created == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      published: ${{ steps.resolve.outputs.published }}
    # GitHub returns draft releases only to callers with push access.
    # https://docs.github.com/en/rest/releases/releases#list-releases
    # This job uses the permission for visibility. Its helper performs reads only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Resolve immutable release source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
          RELEASE_PLEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: bun scripts/release-artifacts.ts resolve

  # One release-please run creates the draft, resolves its immutable source,
  # builds every platform, and publishes only after download verification.
  # A manual tag dispatch resumes the same path for an existing draft.
  build-artifacts:
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.published == 'false' }}
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    # Recent cold-build durations ranged 12m22s-33m39s; 90m matches CI's own
    # DuckDB cold-build guard and leaves headroom above the slowest observed run.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: axctl-darwin-arm64
          # Intel macOS. GitHub retired the macos-13 image; macos-15-intel is
          # the current x64 standard runner label. `scripts/build-duckdb.sh`
          # branches on `uname -s` only, so
          # this leg builds a native x64 libduckdb with no arch-specific casing,
          # and `install.sh` already maps `x86_64` -> `x64` (#835).
          - runner: macos-15-intel
            artifact: axctl-darwin-x64
          - runner: ubuntu-24.04
            artifact: axctl-linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          fetch-depth: 0 # full history + tags so build-axctl.ts can bake the release tag

      - name: Verify checkout source
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "$TAG_NAME^{}")" = "$RELEASE_SHA"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - run: bun install --frozen-lockfile

      - run: bash -n install.sh

      - run: bun run typecheck

      - run: bun test

      - run: bun run check:cli-reference

      # DuckDB is a native dep with an expensive from-scratch build
      # (scripts/build-duckdb.sh, mirrors CI's own `duckdb` job). Reusing a
      # full built artifact - not a compiler cache - is what lets the
      # restored bytes be air-gap smoked directly before build-axctl.ts's
      # writeManifestReusingBuild() embeds them, the same trust proof CI
      # runs on every fire.
      #
      # GitHub Actions caches are scoped per-ref (a saved cache is visible to
      # the ref that made it, that ref's base branches, and the default
      # branch - never to another tag), so a cache this job saves under a
      # release tag is invisible to the NEXT release tag. The
      # prime-duckdb-cache job below saves the identical key from `main` (a
      # trusted default-branch run) so every later release tag gets a warm
      # restore instead of a from-scratch build. The restore/build/smoke/save
      # logic is factored into ./.github/actions/provision-duckdb so both
      # jobs compute a byte-identical cache key by construction.
      - name: Provision DuckDB build
        uses: ./.github/actions/provision-duckdb
        with:
          label: ${{ matrix.artifact }}

      - run: bun scripts/build-axctl.ts apps/axctl/src/cli/index.ts dist/axctl

      - name: Smoke compiled CLI
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          version_output="$(./dist/axctl --version)"
          test "${version_output%%$'\n'*}" = "axctl ${TAG_NAME#v}"
          printf '%s\n' "$version_output" | grep -Eq "^build: $TAG_NAME \\(g[0-9a-f]+\\) - release tag $TAG_NAME$"
          printf '%s\n' "$version_output" | grep -Fqx 'source: compiled binary'
          ./dist/axctl help

      - name: Package binary
        run: |
          set -euo pipefail
          file dist/axctl
          mkdir -p package
          cp dist/axctl package/axctl
          chmod 755 package/axctl
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package axctl

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish-artifacts:
    needs: [resolve-release, build-artifacts]
    # A draft requires every platform build. A published retry skips all builds
    # and performs remote verification without changing release data.
    if: >-
      ${{ always()
      && needs.resolve-release.result == 'success'
      && (needs.resolve-release.outputs.published == 'true'
        || needs.build-artifacts.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
      RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
      RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
      RELEASE_PUBLISHED: ${{ needs.resolve-release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve-release.outputs.published == 'false' }}
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload, download, verify, and publish draft
        if: ${{ needs.resolve-release.outputs.published == 'false' }}
        run: bun scripts/release-artifacts.ts publish release-assets

      - name: Verify existing published release
        if: ${{ needs.resolve-release.outputs.published == 'true' }}
        run: bun scripts/release-artifacts.ts verify
